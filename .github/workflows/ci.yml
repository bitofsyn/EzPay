name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ezpay-82sw.onrender.com

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Java 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: 백엔드 테스트
        run: ./gradlew test --no-daemon
