server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    allow-bean-definition-overriding: true
  application:
    name: EzPay  # 애플리케이션 이름
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ezpay}}}
    username: ${DB_USERNAME:${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
    password: ${DB_PASSWORD:${DB_PASS:${SPRING_DATASOURCE_PASSWORD:password}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 부하 테스트 결과 풀 크기 10은 수백 VU 동시 접수 시 즉시 고갈되는 SPOF였다.
      # 30으로 상향(환경변수로 조정 가능). DB max_connections·CPU 코어 수와 함께 튜닝할 것.
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:10}
      connection-timeout: 30000

  task:
    execution:
      pool:
        core-size: 10  # 기본 스레드 수
        max-size: 100  # 최대 스레드 수
        queue-capacity: 500  # 대기 큐 사이즈
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

logging:
  level:
    org:
      hibernate:
        SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
        type:
          descriptor:
            sql:
              BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_BINDER:INFO}
      springframework:
        security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# 소셜 로그인(OAuth) 제공자 설정
# client-id/secret 은 코드/설정에 하드코딩하지 말고 환경변수(.env)로 주입한다. (예시는 placeholder)
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
    user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}

# Actuator / Micrometer: Prometheus 수집용 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        # 부하 테스트 모니터링에 필요한 엔드포인트만 외부에 노출
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
  metrics:
    tags:
      # Grafana에서 서비스별로 구분할 수 있도록 공통 태그 부여
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true

ezpay:
  kafka:
    enabled: ${EZPAY_KAFKA_ENABLED:false}
  # 사전 위험도 분석(FDS) 설정. 원장 기록 직전 동기 평가로 송금 차단/보류를 결정한다.
  fds:
    block-score: ${EZPAY_FDS_BLOCK_SCORE:80}     # 누적 위험 점수 >= 이 값이면 차단(BLOCK)
    review-score: ${EZPAY_FDS_REVIEW_SCORE:40}   # >= 이 값이면 통과시키되 관리자 검토(REVIEW)
    high-amount:
      caution-threshold: ${EZPAY_FDS_CAUTION_THRESHOLD:1000000}
      danger-threshold: ${EZPAY_FDS_DANGER_THRESHOLD:3000000}
    velocity:
      window-seconds: ${EZPAY_FDS_VELOCITY_WINDOW_SECONDS:60}  # 속도 룰 관찰 시간창(초)
      max-count: ${EZPAY_FDS_VELOCITY_MAX_COUNT:5}             # 시간창 내 이 건수 이상이면 차단
    blacklist:
      accounts: ${EZPAY_FDS_BLACKLIST_ACCOUNTS:}              # 쉼표 구분 블랙리스트 계좌번호
    circuit-breaker:
      failure-threshold: ${EZPAY_FDS_CB_FAILURE_THRESHOLD:5}  # 연속 실패 이 횟수 초과 시 회로 개방
      open-millis: ${EZPAY_FDS_CB_OPEN_MILLIS:30000}          # 회로 개방 유지 시간(ms)

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      # 운영 스키마 변경은 Flyway 마이그레이션으로만 관리한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never
