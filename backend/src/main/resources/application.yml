server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    allow-bean-definition-overriding: true
  application:
    name: EzPay  # 애플리케이션 이름
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ezpay}}}
    username: ${DB_USERNAME:${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
    password: ${DB_PASSWORD:${DB_PASS:${SPRING_DATASOURCE_PASSWORD:password}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 부하 테스트 결과 풀 크기 10은 수백 VU 동시 접수 시 즉시 고갈되는 SPOF였다.
      # 30으로 상향(환경변수로 조정 가능). DB max_connections·CPU 코어 수와 함께 튜닝할 것.
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:10}
      connection-timeout: 30000

  task:
    execution:
      pool:
        core-size: 10  # 기본 스레드 수
        max-size: 100  # 최대 스레드 수
        queue-capacity: 500  # 대기 큐 사이즈
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    # 방언(dialect)은 Hibernate 가 JDBC 메타데이터로 자동 감지한다(명시하면 HHH90000025 경고).
    # 영속성 컨텍스트(DB 커넥션)를 HTTP 응답 렌더링이 끝날 때까지 붙잡지 않는다. SSE 같은 장시간 요청이 커넥션을
    # 점유하지 않게 하기 위함이다. 응답에 필요한 연관은 서비스 트랜잭션 안에서 읽거나 fetch join/엔티티 그래프로 함께 조회한다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

logging:
  level:
    org:
      hibernate:
        SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
        type:
          descriptor:
            sql:
              BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_BINDER:INFO}
      springframework:
        security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# 소셜 로그인(OAuth) 제공자 설정
# client-id/secret 은 코드/설정에 하드코딩하지 말고 환경변수(.env)로 주입한다. (예시는 placeholder)
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
    user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}

# Actuator / Micrometer: Prometheus 수집용 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        # 기본값은 헬스 체크용 엔드포인트만 노출한다(공개 배포 환경 기준, secure by default).
        # Prometheus 가 스크레이프하는 환경에서만 MANAGEMENT_ENDPOINTS_INCLUDE=health,info,prometheus 로 연다.
        # (docker-compose.yml 의 backend 서비스와 local 프로파일은 이미 그렇게 설정되어 있다)
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
      base-path: /actuator
  endpoint:
    health:
      # 익명 요청에는 UP/DOWN 만 응답하고, DB·디스크 등 세부 정보는 인증된 사용자에게만 보여준다.
      show-details: when-authorized
    prometheus:
      access: read_only
  health:
    mail:
      # 메일 헬스 체크는 요청마다 SMTP 에 직접 접속한다. SMTP 아웃바운드가 막힌 환경(Render 무료 인스턴스)에서는
      # 연결 타임아웃까지 2분 넘게 /actuator/health 를 붙잡아 전체 헬스 체크가 멈췄다.
      # 메일 장애는 송금을 막지 않으므로(발송 이력·재시도로 처리) 헬스 판정에서 뺀다. 필요하면 환경변수로 켠다.
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  metrics:
    tags:
      # Grafana에서 서비스별로 구분할 수 있도록 공통 태그 부여
      application: ${spring.application.name}
    distribution:
      # histogram_quantile(p95/p99) 계산에 필요한 _bucket 시계열을 생성한다.
      # (미설정 시 http_server_requests_seconds_bucket 이 없어 지연 시간 패널이 비어 있게 된다)
      percentiles-histogram:
        "[http.server.requests]": true
      # 버킷 범위를 제한해 uri × method × status 조합의 시계열 폭증을 억제한다.
      minimum-expected-value:
        "[http.server.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 10s
  prometheus:
    metrics:
      export:
        enabled: true

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true

ezpay:
  kafka:
    enabled: ${EZPAY_KAFKA_ENABLED:false}
  notification:
    admin-email: ${ADMIN_ALERT_EMAIL:${SMTP_USERNAME:}}
    email:
      max-attempts: ${EMAIL_MAX_ATTEMPTS:3}
      retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:60}
      retry-interval-ms: ${EMAIL_RETRY_INTERVAL_MS:30000}
  # 사전 위험도 분석(FDS) 설정. 원장 기록 직전 동기 평가로 송금 차단/보류를 결정한다.
  fds:
    block-score: ${EZPAY_FDS_BLOCK_SCORE:80}     # 누적 위험 점수 >= 이 값이면 차단(BLOCK)
    review-score: ${EZPAY_FDS_REVIEW_SCORE:40}   # >= 이 값이면 통과시키되 관리자 검토(REVIEW)
    high-amount:
      caution-threshold: ${EZPAY_FDS_CAUTION_THRESHOLD:1000000}
      danger-threshold: ${EZPAY_FDS_DANGER_THRESHOLD:3000000}
    velocity:
      window-seconds: ${EZPAY_FDS_VELOCITY_WINDOW_SECONDS:60}  # 속도 룰 관찰 시간창(초)
      max-count: ${EZPAY_FDS_VELOCITY_MAX_COUNT:5}             # 시간창 내 이 건수 이상이면 차단
    blacklist:
      accounts: ${EZPAY_FDS_BLACKLIST_ACCOUNTS:}              # 쉼표 구분 블랙리스트 계좌번호
    circuit-breaker:
      failure-threshold: ${EZPAY_FDS_CB_FAILURE_THRESHOLD:5}  # 연속 실패 이 횟수 초과 시 회로 개방
      open-millis: ${EZPAY_FDS_CB_OPEN_MILLIS:30000}          # 회로 개방 유지 시간(ms)

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

# 로컬 개발(gradle bootRun)에서는 모니터링 스택이 바로 수집할 수 있도록 prometheus 엔드포인트를 연다.
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,prometheus}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      # 운영 스키마 변경은 Flyway 마이그레이션으로만 관리한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never
