# ─────────────────────────────────────────────────────────────────────────────
# 부하 테스트용 로컬 모니터링 스택 (Prometheus + Grafana)
#
# 실행:   docker-compose -f docker-compose-monitoring.yml up -d
# 중지:   docker-compose -f docker-compose-monitoring.yml down
#
# 수집 대상은 host.docker.internal(호스트 머신)의 게시 포트를 향한다.
# 따라서 백엔드/AI 서버가 호스트에서 직접 실행되든(gradle/uvicorn),
# 기존 docker-compose.yml 컨테이너로 실행되든(포트 게시됨) 동일하게 수집된다.
# ─────────────────────────────────────────────────────────────────────────────
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"          # 설정 리로드: curl -X POST localhost:9090/-/reload
    extra_hosts:
      # Linux 호환용. Docker Desktop(Mac/Windows)은 기본 제공하지만 명시해도 무해하다.
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"                        # 프론트엔드(3000)와 충돌 방지 위해 3001 게시
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
