# Grafana 기동 시 /var/lib/grafana/dashboards 하위 JSON 대시보드를 자동 로드한다.
apiVersion: 1

providers:
  - name: "EzPay Dashboards"
    orgId: 1
    folder: "EzPay"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
