# ─────────────────────────────────────────────────────────────────────────────
# Prometheus 스크레이프 설정
# 대상: 호스트에서 게시된 각 마이크로서비스의 메트릭 엔드포인트
#   - backend (Spring Boot)      : /actuator/prometheus  (port 8081)
#   - ai-category-server (FastAPI): /metrics               (port 8000)
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 5s          # 부하 테스트 중 변화를 촘촘히 관찰하기 위해 5초
  evaluation_interval: 15s
  scrape_timeout: 5s

# 경보 규칙. Alertmanager 는 두지 않으므로 발화 상태는 Prometheus UI(/alerts)에서 확인한다.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot 백엔드 (Micrometer → Actuator)
  # application 라벨은 앱이 직접 붙이므로(management.metrics.tags.application) 여기서 중복 지정하지 않는다.
  # 타깃 라벨로 다시 지정하면 충돌로 인해 모든 시계열에 exported_application 라벨이 추가된다.
  - job_name: "ezpay-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: "backend"

  # AI 카테고리 분류 서버 (FastAPI Instrumentator)
  - job_name: "ai-category-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          application: "ai-category-server"
          service: "ai-category"
