# ─────────────────────────────────────────────────────────────────────────────
# Prometheus 스크레이프 설정
# 대상: 호스트에서 게시된 각 마이크로서비스의 메트릭 엔드포인트
#   - backend (Spring Boot)      : /actuator/prometheus  (port 8081)
#   - ai-category-server (FastAPI): /metrics               (port 8000)
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 5s          # 부하 테스트 중 변화를 촘촘히 관찰하기 위해 5초
  evaluation_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot 백엔드 (Micrometer → Actuator)
  - job_name: "ezpay-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          application: "EzPay"
          service: "backend"

  # AI 카테고리 분류 서버 (FastAPI Instrumentator)
  - job_name: "ai-category-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          application: "ai-category-server"
          service: "ai-category"
